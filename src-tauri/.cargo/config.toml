# Portable build settings. No absolute paths belong in this file: the repo must
# build from any checkout location on any machine. Machine-specific toolchain
# workarounds (broken linker, AV-quarantined CRT libs, missing SDK headers) go
# in the user-level %USERPROFILE%\.cargo\config.toml, never here. See README,
# "Machine-specific toolchain workarounds".

[target.x86_64-pc-windows-msvc]
# Static CRT: the shipped exe has no VC redistributable dependency, so the
# installer is self-contained on a fresh Windows install.
rustflags = ["-C", "target-feature=+crt-static"]
