[package]
name = "demod"
version = "0.1.0"
description = "A dictation app powered by Whisper"
authors = ["you"]
edition = "2021"

[lib]
# Renamed typr_lib -> demod_lib on 2026-07-20 alongside the product rename to
# Demod, together with every `use demod_lib::...` import in src-tauri/src/*.rs.
# An earlier pass deferred this and left the crate named after the old product,
# which is exactly the "the repo still says Typr" problem the rename exists to
# solve. No internal identifier should outlive the name it was derived from.
name = "demod_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
enigo = "0.2"
reqwest = { version = "0.12", features = ["multipart", "json", "stream"] }
hound = "3.5"
tokio = { version = "1", features = ["full"] }
dirs = "6"
arboard = "3"
futures-util = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
# Same version wry/tao already pull in — keep in sync to avoid a second copy.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
] }
winreg = "0.52"
