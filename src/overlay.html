<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* Fixed 440x160 transparent host window (Wispr "Status" window pattern).
         The OS window never resizes; the pill morphs entirely in here.
         All states are pre-mounted layers crossfaded with opacity + transform
         ONLY (GPU compositable - no width/height/layout animation). */
      /* This webview is standalone and does not load src/style.css, so the one
         brand token it needs is declared here. Keep in sync with --accent in
         style.css, which comes from the template remote. */
      :root {
        --accent: #5e6ad2;
        --color-red: #e5484d;

        /* Cyberpunk/vaporwave palette (TJ 2026-07-20 retheme). All colors and
           durations used anywhere in this file - including the canvas JS -
           must be declared here; nothing else may hardcode a literal. */
        --color-neon-violet: #b14dff;
        --color-neon-magenta: #ff2fd6;
        --color-neon-cyan: #2ee6ff;
        --color-neon-white: #f5f0ff;

        /* Idle pill: dark midnight purple body, neon violet outline that
           glows so it reads against any desktop background behind it. */
        --pill-idle-bg: rgba(15, 7, 28, 0.94);
        --pill-idle-bg-hover: rgba(21, 10, 38, 0.97);
        --pill-idle-border: rgba(177, 77, 255, 0.9);
        --pill-idle-glow-inner: rgba(177, 77, 255, 0.5);
        --pill-idle-glow-outer: rgba(255, 47, 214, 0.35);
        --pill-idle-glow-outer-peak: rgba(255, 47, 214, 0.6);
        --pill-idle-pulse-duration: 2.6s;

        /* Hover glow: DIMMER than idle, not brighter (TJ 2026-07-20). The
           reflex is to brighten on hover, but this pill sits on top of other
           apps - at hover distance the neon bloom was reading as glare. The
           hover affordance is carried by the scale-up and the pulse instead,
           so the glow can back off. Roughly half the idle alpha, tighter
           radii. */
        --pill-idle-glow-inner-hover: rgba(177, 77, 255, 0.26);
        --pill-idle-glow-outer-hover: rgba(255, 47, 214, 0.16);
        --pill-hover-pulse-duration: 0.9s;
        --pill-hover-scale: 1.12;
        --pill-hover-scale-peak: 1.19;

        /* Recording pill: stays RED (the mic-is-live cue), just pushed
           toward a crisper neon treatment - brighter edge, stronger glow. */
        --pill-recording-bg: rgba(120, 18, 22, 0.92);
        --pill-recording-bg-hover: rgba(140, 22, 26, 0.97);
        --pill-recording-border: rgba(255, 72, 77, 0.95);
        --pill-recording-glow: rgba(255, 72, 77, 0.65);
        --pill-recording-glow-hover: rgba(229, 72, 77, 0.7);

        /* Waveform stroke: single flat color (TJ 2026-07-20 - "why is it
           gradient? It should just be one color for the wavelength"). Cyan
           is the complement of the red recording-pill background, so it
           separates cleanly (measured ~8.5:1 luminance-contrast against
           --pill-recording-bg, well above the 4.5:1 target) - magenta/violet
           against red was explicitly ruled out for reading poorly. One
           token, so changing the wave color later is a one-line edit. */
        --wave-stroke: var(--color-neon-cyan);
        --wave-glow-color: rgba(46, 230, 255, 0.6);

        /* App mark inside the idle pill. Mirrors --accent / --logo-color in
           src/style.css (#f23df5) EXACTLY, so the floating pill, the settings
           sidebar and the desktop icon are one mark in one colour. Declared
           as a literal here only because overlay.html is a standalone document
           that does not load style.css - if you change the accent there,
           change it here too. */
        --logo-color: #f23df5;
      }

      * { margin: 0; padding: 0; }
      html, body {
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      /* Pill root: bottom-center of the host. The empty headroom above is
         animation/menu space and stays fully transparent.
         NOTE: the cursor hit rect in src-tauri/src/pill_hittest.rs (PILL_*
         consts) must track this geometry — the window is click-through
         except over that rect. */
      #mic {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 16px;
        height: 40px;
      }

      /* Every state is a pre-mounted layer, centered on the same point.
         Inactive: transparent, slightly sunk + shrunk, not hittable.
         Active: opaque, at rest. 150ms ease-out in / ease-in out. */
      .layer {
        position: absolute;
        left: 50%;
        top: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(20, 20, 20, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        opacity: 0;
        transform: translate(-50%, -50%) translateY(5px) scale(0.96);
        transition: opacity 150ms ease-in, transform 150ms ease-in;
        pointer-events: none;
        cursor: grab;
      }
      .layer:active { cursor: grabbing; }
      /* Children must not become the mousedown target, or the
         data-tauri-drag-region hit test on the layer fails. */
      .layer * { pointer-events: none; }

      #mic[data-state="idle"] .state-idle,
      #mic[data-state="listening"] .state-listening,
      #mic[data-state="processing"] .state-processing,
      #mic[data-state="done"] .state-done,
      #mic[data-state="confirm-discard"] .state-confirm-discard,
      #mic[data-state="notice"] .state-notice,
      #mic[data-state="paste-fallback"] .state-paste-fallback {
        opacity: 1;
        transform: translate(-50%, -50%);
        transition: opacity 150ms ease-out, transform 150ms ease-out;
        pointer-events: auto;
      }

      /* Idle: near-invisible dark lozenge. Brightens/expands slightly on
         hover so it reads as clickable (transform/opacity only). Hover
         emphasis (US-009): fully opaque + slight scale-up, still
         transform/opacity only, composing with the centering transform. */
      /* Idle is the app's dock icon: the Demod mark, not a blank lozenge. Same
         logo as the settings sidebar (index.html .app-icon) so the floating
         pill and the window read as one product. Kept small and dim so it
         stays unobtrusive on top of other apps, and it brightens on hover
         using transform/opacity only - never layout - so the fixed-size
         overlay window is untouched. */
      .state-idle {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        position: absolute; /* .layer already sets this; kept explicit so the
                                hotkey tooltip below can anchor off this box */
        background: var(--pill-idle-bg);
        border-color: var(--pill-idle-border);
        box-shadow:
          0 0 8px 1px var(--pill-idle-glow-inner),
          0 0 16px 3px var(--pill-idle-glow-outer);
        animation: idle-pulse var(--pill-idle-pulse-duration) ease-in-out infinite;
      }
      /* Border/glow "alive" pulse - CSS var-driven so the duration is a
         single source of truth in :root. Disabled entirely under reduced
         motion (see the media query near the bottom of this stylesheet). */
      @keyframes idle-pulse {
        0%, 100% {
          box-shadow:
            0 0 8px 1px var(--pill-idle-glow-inner),
            0 0 16px 3px var(--pill-idle-glow-outer);
        }
        50% {
          box-shadow:
            0 0 11px 2px var(--pill-idle-glow-inner),
            0 0 22px 5px var(--pill-idle-glow-outer-peak);
        }
      }
      .state-idle .logo {
        width: 18px;
        height: 18px;
        opacity: 0.85;
      }
      /* Reverted to an inline SVG on 2026-07-20. It had been a base64 raster
         PNG, which silently froze the OLD pre-rename mark into this file: the
         desktop icon and the settings sidebar both updated and the floating
         pill did not, because a data URI cannot follow a token. Inline SVG
         driven by --logo-color makes that drift impossible. Do not convert
         this back to a raster. Geometry is the same 5 bars as
         index.html .app-icon and src-tauri/icons/generate_icons.py. */
      .state-idle .logo rect {
        fill: var(--logo-color);
      }
      /* Hover: expand AND keep pulsing (TJ 2026-07-20 - "it should pulse as
         well as the expand animation"). The idle breathe animates box-shadow;
         this one animates transform, so it cannot simply inherit - a transform
         keyframe must restate the centering translate or the pill jumps to the
         window corner mid-animation. Declaring `animation` here also replaces
         idle-pulse, which is what lets the dimmer static box-shadow below
         actually take effect instead of being overwritten by the breathe. */
      @keyframes hover-pulse {
        0%, 100% { transform: translate(-50%, -50%) scale(var(--pill-hover-scale)); }
        50%      { transform: translate(-50%, -50%) scale(var(--pill-hover-scale-peak)); }
      }
      #mic[data-state="idle"] .state-idle:hover {
        opacity: 1;
        background: var(--pill-idle-bg-hover);
        transform: translate(-50%, -50%) scale(var(--pill-hover-scale));
        box-shadow:
          0 0 6px 1px var(--pill-idle-glow-inner-hover),
          0 0 12px 2px var(--pill-idle-glow-outer-hover);
        animation: hover-pulse var(--pill-hover-pulse-duration) ease-in-out infinite;
      }
      #mic[data-state="idle"] .state-idle:hover .logo {
        opacity: 1;
      }

      /* Hotkey hover tooltip (idle only). Purely decorative overlay - never
         affects the pill's own width/height, so the fixed-size host window
         and drag-region hit test are untouched. Positioned above the pill,
         shown/hidden via opacity + transform only. Text is filled at runtime
         from get_settings(); left empty (nothing shown) until it resolves. */
      .idle-hotkey {
        position: absolute;
        left: 50%;
        bottom: calc(100% + 8px);
        transform: translateX(-50%) translateY(4px);
        white-space: nowrap;
        font-size: 11px;
        color: #d8d8d8;
        background: rgba(24, 24, 24, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        padding: 4px 8px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 120ms ease-out, transform 120ms ease-out;
      }
      #mic[data-state="idle"] .state-idle:hover .idle-hotkey.has-hotkey {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* Strengthened hover for the active (non-idle) layers: fully opaque,
         slightly larger, transform/opacity only. */
      .layer:hover {
        background: rgba(20, 20, 20, 0.95);
      }
      /* Listening must stay red even on hover - overrides the generic
         .layer:hover darkening above (loaded later, so it wins by source
         order without needing !important). */
      #mic[data-state="listening"] .state-listening:hover {
        background: var(--pill-recording-bg-hover);
        box-shadow: 0 0 14px 2px var(--pill-recording-glow-hover);
      }
      #mic[data-state="listening"] .state-listening:hover,
      #mic[data-state="processing"] .state-processing:hover,
      #mic[data-state="done"] .state-done:hover {
        transform: translate(-50%, -50%) scale(1.04);
      }

      /* Confirm-discard (US-006): shown after the first Esc past the 30s
         guard; second Esc within 3s discards. */
      .state-confirm-discard {
        width: 220px;
        height: 36px;
        padding: 0 14px;
        font-size: 12px;
        color: #f2b8b8;
        white-space: nowrap;
      }

      /* Transient notice: same lozenge shape as paste-fallback, but its text
         is set at runtime and it auto-reverts to idle. Used to report why a
         quick-menu action could not run, rather than failing silently. */
      .state-notice {
        width: 240px;
        height: 36px;
        padding: 0 14px;
        font-size: 12px;
        color: #d8d8d8;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Paste-fallback (US-007): shown when refocus/paste fails; transcript
         stays on the clipboard until the next state change. */
      .state-paste-fallback {
        width: 240px;
        height: 36px;
        padding: 0 14px;
        font-size: 12px;
        color: #d8d8d8;
        white-space: nowrap;
      }

      /* Status dot (US-008): 8px dot pinned to the pill's corner, visible
         only on the layers that carry state (listening/processing/done).
         Color driven by #mic[data-dot] via CSS vars; crossfaded via
         opacity only, never removed from the DOM. */
      .status-dot {
        position: absolute;
        top: -2px;
        right: -2px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--dot-color, transparent);
        opacity: 0;
        transition: opacity 150ms ease-out, background-color 150ms ease-out;
        pointer-events: none;
      }
      #mic[data-state="listening"] .state-listening .status-dot,
      #mic[data-state="processing"] .state-processing .status-dot,
      #mic[data-state="done"] .state-done .status-dot {
        opacity: 1;
      }
      #mic[data-dot="starting"] .status-dot { --dot-color: #e0c341; }
      #mic[data-dot="processing"] .status-dot { --dot-color: #4a9ff5; }
      #mic[data-dot="done"] .status-dot { --dot-color: #6fe08c; }
      #mic[data-dot="off"] .status-dot,
      #mic:not([data-dot]) .status-dot { opacity: 0; }

      /* Listening: red pill (mic is unmistakably live) containing a flowing
         waveform canvas driven by real mic RMS. The canvas is redrawn each
         rAF frame (transform/opacity-equivalent - a canvas redraw never
         touches layout), never resized here; only its 2D content changes. */
      .state-listening {
        width: 180px;
        height: 36px;
        background: var(--pill-recording-bg);
        border-color: var(--pill-recording-border);
        box-shadow: 0 0 10px 1px var(--pill-recording-glow);
      }
      .state-listening canvas.waveform {
        width: 160px;
        height: 28px;
      }

      /* Processing: three dots pulsing with staggered opacity. */
      .state-processing {
        width: 120px;
        height: 36px;
        gap: 6px;
      }
      .state-processing .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #fff;
        opacity: 0.25;
      }
      #mic[data-state="processing"] .state-processing .dot {
        animation: dot-pulse 1s ease-in-out infinite;
      }
      #mic[data-state="processing"] .state-processing .dot:nth-child(2) {
        animation-delay: 0.15s;
      }
      #mic[data-state="processing"] .state-processing .dot:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes dot-pulse {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 1; }
      }

      /* Done: brief success tick. */
      .state-done {
        width: 64px;
        height: 36px;
      }
      .state-done svg {
        width: 18px;
        height: 18px;
        stroke: #6fe08c;
        stroke-width: 2.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Right-click quick menu (US-009): grows upward from the pill,
         transform-origin bottom center, scale + opacity only, ~120ms.
         Positioned above the pill, within the 440x160 host bounds. */
      #quick-menu {
        position: fixed;
        left: 50%;
        bottom: 64px;
        transform: translateX(-50%) scale(0.95);
        transform-origin: bottom center;
        display: flex;
        flex-direction: column;
        min-width: 170px;
        background: rgba(24, 24, 24, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 10px;
        padding: 4px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 120ms ease-out, transform 120ms ease-out;
      }
      #quick-menu[data-open="true"] {
        opacity: 1;
        transform: translateX(-50%) scale(1);
        pointer-events: auto;
      }
      #quick-menu .menu-item {
        appearance: none;
        border: none;
        background: transparent;
        color: #eaeaea;
        font-family: inherit;
        font-size: 12.5px;
        text-align: left;
        padding: 7px 10px;
        border-radius: 6px;
        cursor: pointer;
      }
      #quick-menu .menu-item:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      /* Reduced motion (US-006/waveform): fall back to a calm static bar
         showing the current level as a fixed-width fill, no scrolling/flow.
         The JS render loop checks this same query and skips the scroll
         phase + redraw cadence; this class only affects the flatline look
         drawn once. */
      @media (prefers-reduced-motion: reduce) {
        .state-listening canvas.waveform {
          opacity: 0.9;
        }
        .state-idle {
          animation: none;
          box-shadow:
            0 0 8px 1px var(--pill-idle-glow-inner),
            0 0 16px 3px var(--pill-idle-glow-outer);
        }
        /* The hover pulse is motion too. Keep the dimmer hover glow and the
           static scale-up (both are affordances, not motion), drop only the
           looping animation. */
        #mic[data-state="idle"] .state-idle:hover {
          animation: none;
          transform: translate(-50%, -50%) scale(var(--pill-hover-scale));
        }
      }
    </style>
  </head>
  <body>
    <div id="mic" data-state="idle">
      <div class="layer state-idle" data-tauri-drag-region>
        <svg
          class="logo"
          viewBox="0 0 24 24"
          aria-hidden="true"
          data-tauri-drag-region
        >
          <rect x="0.5"  y="9"   width="3" height="6"  rx="1.4"/>
          <rect x="5.5"  y="5"   width="3" height="14" rx="1.4"/>
          <rect x="10.5" y="1.5" width="3" height="21" rx="1.4"/>
          <rect x="15.5" y="5"   width="3" height="14" rx="1.4"/>
          <rect x="20.5" y="9"   width="3" height="6"  rx="1.4"/>
        </svg>
        <div class="idle-hotkey" id="idle-hotkey"></div>
      </div>
      <div class="layer state-listening" data-tauri-drag-region>
        <canvas class="waveform" width="320" height="56"></canvas>
        <div class="status-dot"></div>
      </div>
      <div class="layer state-processing" data-tauri-drag-region>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="status-dot"></div>
      </div>
      <div class="layer state-done" data-tauri-drag-region>
        <svg viewBox="0 0 24 24"><polyline points="5 12.5 10 17.5 19 7"/></svg>
        <div class="status-dot"></div>
      </div>
      <div class="layer state-confirm-discard" data-tauri-drag-region>
        <span>Discard? press Esc again</span>
      </div>
      <!-- Transient message layer. A quick-menu action that fails (e.g. "Paste
           last transcript" with nothing recorded yet) reports the reason here
           instead of appearing to do nothing. -->
      <div class="layer state-notice" data-tauri-drag-region>
        <span id="notice-text"></span>
      </div>
      <div class="layer state-paste-fallback" data-tauri-drag-region>
        <span>Copied &mdash; press Ctrl+V to paste</span>
      </div>
    </div>
    <div id="quick-menu" data-open="false" role="menu">
      <button class="menu-item" type="button" data-action="menu_hide_hour">Hide for 1 hour</button>
      <button class="menu-item" type="button" data-action="menu_paste_last">Paste last transcript</button>
      <button class="menu-item" type="button" data-action="menu_open_settings">Settings</button>
      <button class="menu-item" type="button" data-action="menu_quit">Quit</button>
    </div>
    <script>
      // Waveform renderer: real mic RMS pushed from Rust (audio.rs emits
      // 'audio-level', a single float, at <=30Hz while recording). One rAF
      // loop runs ONLY while data-state=listening (started/stopped by a
      // MutationObserver on the attribute - event-driven, no polling, and it
      // is naturally paused whenever the window is hidden/occluded since
      // requestAnimationFrame itself pauses then - the loop never assumes a
      // frame actually painted). Drawn as a flowing waveform on a canvas: a
      // canvas redraw is a pixel operation, never a layout-affecting CSS
      // property, so it is as safe as the old transform: scaleY approach.
      //
      // Third attempt (see tasks/lessons.md history): the first two builds
      // failed because (1) a modulated-in-place sine never travelled and
      // (2) a coarse 64-sample ring buffer snapped to a literal flat line at
      // silence with near-invisible amplitude. This build draws a dense,
      // continuously-travelling multi-sine surface spanning the FULL pill
      // width at all times - there is no "silence" visual state, only a
      // lower-amplitude/slower idle wave. Phase is derived directly from
      // performance.now() (never accumulated frame-to-frame), so the wave is
      // correct immediately after any rAF pause caused by window occlusion.
      (() => {
        const IDLE_AMP = 0.22;      // idle amplitude floor as a fraction of max - never drops below this, so it never reads as flat
        const PEAK_FLOOR = 0.02;    // adaptive-peak floor - keeps quiet-room mic noise from being amplified into fake motion
        const PEAK_RELEASE_MS = 450; // TJ 2026-07-20: "it doesn't return back to normal" - was 3000ms (seconds-scale drift after
                                     // speech stopped); tightened to settle to idle in ~400-600ms and then hold steady
        const LEVEL_CURVE = 0.42;   // exponent <1 = aggressive early rise, so quiet speech still moves the wave a lot
        const CYCLES_IDLE = 3.4;    // wavelengths visible across the pill at rest (spec: at least 3-4)
        const CYCLES_MAX = 14;      // TJ 2026-07-20: "pitch needs to change a lot more, a lot higher" - was 6.5 (< 2x range,
                                     // read as barely changing); now a 4x range so loud speech is unmistakably tighter
        const PX_PER_SAMPLE = 2;    // ~1 point per 2 device pixels, per spec
        const TRAVEL_SPEED = 1.35;  // rad/s base travel speed of the dominant component
        const GLOW_BLUR = 8;        // strengthened neon glow (was 6) for the retheme

        // Three layered sine components at different spatial-frequency
        // multipliers, phase speeds (some negative = opposite drift), and
        // weights, summed and normalised - reads as organic, not a pure tone.
        const LAYERS = [
          { freqMul: 1.0, speed: 1.0, weight: 0.5, phase: 0 },
          { freqMul: 1.7, speed: -0.65, weight: 0.3, phase: 1.9 },
          { freqMul: 2.6, speed: 1.4, weight: 0.2, phase: 4.1 },
        ];
        const LAYER_WEIGHT_SUM = LAYERS.reduce((s, l) => s + l.weight, 0);

        const mic = document.getElementById('mic');
        const canvas = document.querySelector('.state-listening canvas.waveform');
        const ctx = canvas ? canvas.getContext('2d') : null;
        const reduceMotion = window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // CSS-pixel canvas size (fixed layout size); device-pixel backing
        // store is sized from devicePixelRatio so the stroke stays crisp on
        // hi-DPI displays instead of blurring the old statically-baked 2x
        // canvas attributes.
        const CSS_W = 160, CSS_H = 28;
        let dpr = 1;
        const fitCanvasToDPR = () => {
          if (!canvas || !ctx) return;
          dpr = window.devicePixelRatio || 1;
          const targetW = Math.round(CSS_W * dpr);
          const targetH = Math.round(CSS_H * dpr);
          if (canvas.width !== targetW) canvas.width = targetW;
          if (canvas.height !== targetH) canvas.height = targetH;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // draw in CSS-pixel coordinates from here on
        };

        let level = 0;             // latest RMS from Rust (untouched - display only reads this, never mutates it)
        let peakEnv = PEAK_FLOOR;  // slow-moving adaptive peak (instant attack, seconds-scale release)
        let rafId = 0;
        let lastNow = 0;

        // Single flat stroke color (TJ 2026-07-20: "why is it gradient? It
        // should just be one color for the wavelength"). Never a literal
        // here - read from the :root custom property (--wave-stroke) so the
        // single source of truth for every color in this file stays :root,
        // per project rule.
        const rootStyle = getComputedStyle(document.documentElement);
        const cssVar = (name, fallback) => {
          const v = rootStyle.getPropertyValue(name).trim();
          return v || fallback;
        };
        const strokeColor = cssVar('--wave-stroke', '#2ee6ff');
        const glowColor = cssVar('--wave-glow-color', 'rgba(46, 230, 255, 0.6)');

        const waveY = (x, now, amp, cycles) => {
          const k = (cycles * 2 * Math.PI) / CSS_W;
          const t = now / 1000;
          let sum = 0;
          for (const layer of LAYERS) {
            sum += layer.weight * Math.sin(x * k * layer.freqMul + layer.phase + t * TRAVEL_SPEED * layer.speed);
          }
          return (sum / LAYER_WEIGHT_SUM) * amp;
        };

        // Turns a raw 0..1-ish RMS level into the normalized 0..1 "curved"
        // drive value used for both amplitude and wavelength - a single
        // adaptive-peak + non-linear-curve computation shared by the live
        // rAF loop and the manual/test-harness path, so both agree.
        const levelToCurve = (lvl) => {
          const absLevel = Math.max(lvl, 0);
          if (absLevel > peakEnv) {
            peakEnv = absLevel;
          } else {
            peakEnv = Math.max(peakEnv, PEAK_FLOOR);
          }
          const norm = Math.min(1, absLevel / Math.max(peakEnv, PEAK_FLOOR));
          return Math.pow(norm, LEVEL_CURVE);
        };

        // Exposed so a standalone test harness can call it directly with an
        // explicit timestamp + level, bypassing rAF entirely (rAF is paused
        // whenever the host window is occluded/backgrounded, so relying on
        // it for verification screenshots is unreliable).
        const drawFrame = (now, lvl) => {
          if (!ctx || !canvas) return;
          fitCanvasToDPR();
          const mid = CSS_H / 2;
          const ampScale = mid * 0.86;

          const curved = levelToCurve(lvl);
          const amp = IDLE_AMP + (1 - IDLE_AMP) * curved;
          const cycles = CYCLES_IDLE + (CYCLES_MAX - CYCLES_IDLE) * curved;

          ctx.clearRect(0, 0, CSS_W, CSS_H);
          ctx.lineWidth = 2.4;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          // NO shadowBlur. The stroke was already a single flat colour, but a
          // blurred glow around it fades from opaque line to transparent edge,
          // which is indistinguishable from a gradient at 30px tall - TJ read
          // it as one twice ("why is it gradient?", then "still a gradient
          // color and not a solid deep color"). A solid line means solid: one
          // colour, hard edges, no halo. Do not reintroduce shadowBlur here.
          ctx.strokeStyle = strokeColor;
          ctx.beginPath();

          if (reduceMotion) {
            // Static/minimal-motion fallback: draw one still frame at the
            // idle wavelength/amplitude, no travel - level still nudges the
            // amplitude a little so it is not completely inert.
            const points = Math.max(24, Math.ceil(CSS_W / (PX_PER_SAMPLE * 2)));
            const staticAmp = IDLE_AMP + (1 - IDLE_AMP) * curved * 0.4;
            for (let i = 0; i <= points; i++) {
              const x = (i / points) * CSS_W;
              const y = mid - waveY(x, 0, staticAmp * ampScale, CYCLES_IDLE);
              if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
          } else {
            const points = Math.max(48, Math.ceil(CSS_W / PX_PER_SAMPLE));
            for (let i = 0; i <= points; i++) {
              const x = (i / points) * CSS_W;
              const y = mid - waveY(x, now, amp * ampScale, cycles);
              if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
          }
          ctx.stroke();
          ctx.shadowBlur = 0;
        };

        const frame = (now) => {
          const dt = lastNow ? now - lastNow : 16;
          lastNow = now;
          // Frame-rate-independent exponential smoothing of the peak
          // envelope's release, driven by wall-clock dt rather than a fixed
          // per-frame step, so it behaves the same whether rAF just resumed
          // after a long pause or is running at 60fps. The actual draw call
          // below re-derives amp/cycles from the *current* level each frame
          // (levelToCurve), which is itself gated by the slow-moving peak
          // envelope - that IS the smoothing; a separate smoothLevel lerp on
          // top would just double-smooth, so drawFrame is the single source
          // of truth here.
          const absLevel = Math.max(level, 0);
          if (absLevel > peakEnv) {
            peakEnv = absLevel;
          } else {
            const releaseAlpha = 1 - Math.exp(-dt / PEAK_RELEASE_MS);
            peakEnv += (Math.max(absLevel, PEAK_FLOOR) - peakEnv) * releaseAlpha;
          }
          peakEnv = Math.max(peakEnv, PEAK_FLOOR);

          drawFrame(now, level);
          rafId = requestAnimationFrame(frame);
        };

        const startLoop = () => {
          if (rafId) return;
          level = 0;
          lastNow = 0;
          peakEnv = PEAK_FLOOR;
          rafId = requestAnimationFrame(frame);
        };

        const stopLoop = () => {
          if (!rafId) return;
          cancelAnimationFrame(rafId);
          rafId = 0;
          peakEnv = PEAK_FLOOR;
          if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
        };

        new MutationObserver(() => {
          if (mic.dataset.state === 'listening') startLoop();
          else stopLoop();
        }).observe(mic, { attributes: true, attributeFilter: ['data-state'] });

        // Rust emits with emit_to("overlay", ...): label-targeted events do
        // NOT reach target-Any listeners (plain event.listen), so listen on
        // this window's own target.
        const tauri = window.__TAURI__;
        if (tauri && tauri.webviewWindow) {
          tauri.webviewWindow.getCurrentWebviewWindow().listen('audio-level', (e) => {
            level = e.payload;
          });
        }

        // Expose the pure draw function for the standalone visual-proof test
        // harness (never used by the app itself) to call directly with
        // explicit timestamps/levels, since rAF pauses when this window is
        // occluded and cannot be trusted to paint on demand.
        window.__typrWaveformDrawFrame = drawFrame;
      })();

      // Status dot (US-008): Rust emits 'status-dot' with payload
      // 'starting' | 'processing' | 'done' | 'off'. Stored as #mic
      // dataset.dot; CSS keys off [data-dot=...] and crossfades opacity
      // only. Same window-scoped listener pattern as 'audio-level'.
      (() => {
        const mic = document.getElementById('mic');
        const tauri = window.__TAURI__;
        if (tauri && tauri.webviewWindow) {
          tauri.webviewWindow.getCurrentWebviewWindow().listen('status-dot', (e) => {
            mic.dataset.dot = e.payload;
          });
        }
      })();

      // Failed dictation notice. Rust reports a dictation that could not
      // finish here, so the pill says what happened instead of sitting in an
      // animation forever. Delivered as an event payload assigned with
      // textContent, never interpolated into an eval string - engine and
      // network errors are not our text to trust.
      (() => {
        const mic = document.getElementById('mic');
        const tauri = window.__TAURI__;
        if (!tauri || !tauri.webviewWindow) return;
        let timer = null;
        tauri.webviewWindow.getCurrentWebviewWindow().listen('notice', (e) => {
          const el = document.getElementById('notice-text');
          if (!el) return;
          el.textContent = String(e.payload || '');
          mic.dataset.state = 'notice';
          if (timer) clearTimeout(timer);
          // Revert only if nothing else has changed state meanwhile, so a
          // dictation started during the notice is never clobbered.
          timer = setTimeout(() => {
            if (mic.dataset.state === 'notice') mic.dataset.state = 'idle';
          }, 3200);
        });
      })();

      // Right-click quick menu (US-009). All commands are now backed by real
      // Rust handlers in main.rs / pill_hittest.rs; invoke() stays wrapped in
      // .catch to avoid an uncaught rejection if a call ever fails.
      (() => {
        const mic = document.getElementById('mic');
        const menu = document.getElementById('quick-menu');

        // US-009: tell pill_hittest.rs when the menu is open so it widens the
        // OS-level hit rect (data-menu="open") - without this, the pointer
        // moving off the narrow pill rect onto the menu above it would flip
        // the overlay back to click-through and the menu would become
        // unclickable / dismiss itself.
        const reportMenuOpen = (open) => {
          const tauri = window.__TAURI__;
          if (tauri && tauri.core && typeof tauri.core.invoke === 'function') {
            tauri.core.invoke('set_menu_open', { open }).catch(() => {});
          }
        };

        const openMenu = () => {
          menu.dataset.open = 'true';
          mic.dataset.menu = 'open';
          reportMenuOpen(true);
        };
        const closeMenu = () => {
          menu.dataset.open = 'false';
          delete mic.dataset.menu;
          reportMenuOpen(false);
        };
        const isOpen = () => menu.dataset.open === 'true';

        mic.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          openMenu();
        });

        document.addEventListener('mousedown', (e) => {
          if (isOpen() && !menu.contains(e.target)) closeMenu();
        });

        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && isOpen()) closeMenu();
        });

        // Show a short message in the pill, then return it to idle. Reverts
        // only if nothing else has changed the state in the meantime, so a
        // dictation started during the notice is never clobbered.
        let noticeTimer = null;
        const showNotice = (message) => {
          const el = document.getElementById('notice-text');
          if (!el) return;
          el.textContent = message;
          mic.dataset.state = 'notice';
          if (noticeTimer) clearTimeout(noticeTimer);
          noticeTimer = setTimeout(() => {
            if (mic.dataset.state === 'notice') mic.dataset.state = 'idle';
          }, 2400);
        };

        menu.querySelectorAll('.menu-item').forEach((btn) => {
          btn.addEventListener('click', () => {
            const cmd = btn.dataset.action;
            const tauri = window.__TAURI__;
            if (tauri && tauri.core && typeof tauri.core.invoke === 'function') {
              // A swallowed rejection made a typo'd data-action, an
              // unregistered command and a real error ("No transcript yet")
              // all look identical: the menu item simply did nothing. Report
              // the reason instead.
              tauri.core.invoke(cmd).catch((err) => {
                console.error('[Demod] menu action failed:', cmd, err);
                showNotice(typeof err === 'string' ? err : 'That action could not run');
              });
            } else {
              showNotice('Menu unavailable outside the app');
            }
            closeMenu();
          });
        });
      })();

      // Idle hover hotkey tooltip. Mirrors the settings window's formatting
      // (src/main.ts formatHotkey: CmdOrCtrl/Cmd -> Ctrl, Super -> Win) so the
      // overlay and settings UI never disagree about what the hotkey reads
      // as. Resolved lazily on first hover rather than at load, so a hotkey
      // changed in Settings while the overlay is idle is picked up next
      // hover instead of going stale. On any invoke failure or a missing
      // `hotkey` field, the tooltip is left empty (`.has-hotkey` withheld) -
      // never falls back to a hardcoded/remembered string.
      (() => {
        const idleLayer = document.querySelector('.state-idle');
        const tooltip = document.getElementById('idle-hotkey');
        if (!idleLayer || !tooltip) return;

        const TOKEN_MAP = { CmdOrCtrl: 'Ctrl', Cmd: 'Ctrl', Super: 'Win' };
        const formatHotkey = (hotkey) =>
          String(hotkey)
            .split('+')
            .map((token) => TOKEN_MAP[token] ?? token)
            .join('+');

        let resolved = false; // avoid re-invoking on every hover once we know
        let lastGoodText = '';

        const clear = () => {
          tooltip.textContent = '';
          tooltip.classList.remove('has-hotkey');
        };

        const resolve = async () => {
          const tauri = window.__TAURI__;
          if (!tauri || !tauri.core || typeof tauri.core.invoke !== 'function') {
            clear();
            return;
          }
          try {
            const settings = await tauri.core.invoke('get_settings');
            const hotkey = settings && settings.hotkey;
            if (typeof hotkey !== 'string' || !hotkey) {
              clear();
              return;
            }
            lastGoodText = formatHotkey(hotkey);
            tooltip.textContent = lastGoodText;
            tooltip.classList.add('has-hotkey');
          } catch (err) {
            console.error('[Demod] get_settings failed:', err);
            clear();
          } finally {
            resolved = true;
          }
        };

        idleLayer.addEventListener('mouseenter', () => {
          if (!resolved) {
            resolve();
          } else if (lastGoodText) {
            tooltip.textContent = lastGoodText;
            tooltip.classList.add('has-hotkey');
          }
        });
      })();
    </script>
  </body>
</html>
