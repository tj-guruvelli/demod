<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* Fixed 440x160 transparent host window (Wispr "Status" window pattern).
         The OS window never resizes; the pill morphs entirely in here.
         All states are pre-mounted layers crossfaded with opacity + transform
         ONLY (GPU compositable - no width/height/layout animation). */
      /* This webview is standalone and does not load src/style.css, so the one
         brand token it needs is declared here. Keep in sync with --accent in
         style.css, which comes from the template remote. */
      :root {
        --accent: #5e6ad2;
        --color-red: #e5484d;

        /* Cyberpunk/vaporwave palette (TJ 2026-07-20 retheme). All colors and
           durations used anywhere in this file - including the canvas JS -
           must be declared here; nothing else may hardcode a literal. */
        --color-neon-violet: #b14dff;
        --color-neon-magenta: #ff2fd6;
        --color-neon-cyan: #2ee6ff;
        --color-neon-white: #f5f0ff;

        /* Idle pill: BLACK body, neon violet outline only (TJ 2026-07-20 -
           "the pill should be black, only the outline is purple"). The body was
           a dark midnight purple; now it is near-pure black so the sole colour
           is the violet edge + glow. Alpha kept below 1 so the desktop faintly
           shows through, which is what makes it read as a floating glass dock
           rather than a solid black slab. */
        --pill-idle-bg: rgba(0, 0, 0, 0.9);
        --pill-idle-bg-hover: rgba(0, 0, 0, 0.94);
        /* Resting-bar fill (TJ 2026-07-21: "no neon outline glow at rest - just
           a long flat bar, deep purple"). The rest state is now a SOLID deep-
           purple bar with NO box-shadow/glow and NO pulse. The neon violet edge
           + the logo are the HOVER reward only. Alpha < 1 keeps the faint
           floating-glass see-through. */
        --pill-idle-bar-color: rgba(74, 32, 145, 0.92);
        --pill-idle-border: rgba(177, 77, 255, 0.9);
        --pill-idle-glow-inner: rgba(177, 77, 255, 0.5);
        --pill-idle-glow-outer: rgba(255, 47, 214, 0.35);
        --pill-idle-glow-outer-peak: rgba(255, 47, 214, 0.6);
        --pill-idle-pulse-duration: 2.6s;

        /* Hover glow: DIMMER than idle, not brighter (TJ 2026-07-20). The
           reflex is to brighten on hover, but this pill sits on top of other
           apps - at hover distance the neon bloom was reading as glare. The
           hover affordance is carried by the scale-up and the pulse instead,
           so the glow can back off. Roughly half the idle alpha, tighter
           radii. */
        --pill-idle-glow-inner-hover: rgba(177, 77, 255, 0.26);
        --pill-idle-glow-outer-hover: rgba(255, 47, 214, 0.16);
        --pill-hover-pulse-duration: 0.9s;

        /* Idle bar geometry (TJ 2026-07-20: "same height as the Wispr Flow
           interface dock ... let's try 3px first"). At rest the pill is a hair-
           thin neon line; on hover it expands to the RECORDING pill's exact
           box, so hovering previews the shape recording will take.
           Expanded size must stay inside the Rust hit rect (PILL_HIT_W 200 x
           PILL_HIT_H 48 in src-tauri/src/pill_hittest.rs) or the cursor leaves
           the interactive region at the pill's own edge and the hover flickers.
           180x36 leaves 10px/6px of margin. If you grow these, grow the Rust
           consts first. */
        /* TJ 2026-07-21: match Wispr Flow's compact dock size (screenshots) -
           "it's too long". Resting bar short; expanded/recording pill small. */
        --pill-idle-bar-w: 48px;
        --pill-idle-bar-h: 6px;
        --pill-idle-expand-w: 112px;
        --pill-idle-expand-h: 24px;

        /* Recording pill: BLACK body, neon violet edge/glow/trace carry the
           LIVE cue (TJ 2026-07-20 - "the pill should be black, only the outline
           is purple"). Earlier notes debated deep-purple vs red for the BODY;
           that debate is moot now that the body is black. Contrast only gets
           better: the violet edge measures well above the 4.5:1 floor against
           black, and the cyan/violet waveform separates cleanly on it. Slightly
           more opaque than idle so recording reads as more solid/present. */
        --pill-recording-bg: rgba(0, 0, 0, 0.96);
        --pill-recording-bg-hover: rgba(0, 0, 0, 0.97);
        /* RED outline while recording (TJ 2026-07-21: "when it's in recording
           mode, just change the border outline of the recording pill to red").
           Idle stays deep-purple; red is the unmistakable live-recording cue. */
        --pill-recording-border: rgba(229, 72, 77, 0.95);
        --pill-recording-glow: rgba(229, 72, 77, 0.6);
        --pill-recording-glow-hover: rgba(229, 72, 77, 0.7);

        /* Waveform stroke: single flat color (TJ 2026-07-20 - "why is it
           gradient? It should just be one color for the wavelength"). Cyan
           is the complement of the red recording-pill background, so it
           separates cleanly (measured ~8.5:1 luminance-contrast against
           --pill-recording-bg, well above the 4.5:1 target) - magenta/violet
           against red was explicitly ruled out for reading poorly. One
           token, so changing the wave color later is a one-line edit. */
        --wave-stroke: var(--color-neon-violet);
        --wave-glow-color: rgba(177, 77, 255, 0.6);
        /* The faint bar lift (TJ 2026-07-20). Kept as its own token, not a
           tweak of --wave-glow-color, so the old full-strength value stays
           available and the two cannot be confused for each other. */
        --wave-glow-faint: rgba(177, 77, 255, 0.2);

        /* App mark inside the idle pill. Mirrors --accent / --logo-color in
           src/style.css (#f23df5) EXACTLY, so the floating pill, the settings
           sidebar and the desktop icon are one mark in one colour. Declared
           as a literal here only because overlay.html is a standalone document
           that does not load style.css - if you change the accent there,
           change it here too. */
        --logo-color: #f23df5;
      }

      * { margin: 0; padding: 0; }
      html, body {
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      /* Pill root: bottom-center of the host. The empty headroom above is
         animation/menu space and stays fully transparent.
         NOTE: the cursor hit rect in src-tauri/src/pill_hittest.rs (PILL_*
         consts) must track this geometry — the window is click-through
         except over that rect. */
      #mic {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 16px;
        height: 40px;
      }

      /* Every state is a pre-mounted layer, centered on the same point.
         Inactive: transparent, slightly sunk + shrunk, not hittable.
         Active: opaque, at rest. 150ms ease-out in / ease-in out. */
      .layer {
        position: absolute;
        left: 50%;
        top: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(20, 20, 20, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        opacity: 0;
        transform: translate(-50%, -50%) translateY(5px) scale(0.96);
        transition: opacity 150ms ease-in, transform 150ms ease-in;
        pointer-events: none;
        cursor: grab;
      }
      .layer:active { cursor: grabbing; }
      /* Children must not become the mousedown target, or the
         data-tauri-drag-region hit test on the layer fails. */
      .layer * { pointer-events: none; }

      #mic[data-state="idle"] .state-idle,
      #mic[data-state="listening"] .state-listening,
      #mic[data-state="processing"] .state-processing,
      #mic[data-state="done"] .state-done,
      #mic[data-state="confirm-discard"] .state-confirm-discard,
      #mic[data-state="notice"] .state-notice,
      #mic[data-state="paste-fallback"] .state-paste-fallback {
        opacity: 1;
        transform: translate(-50%, -50%);
        transition: opacity 150ms ease-out, transform 150ms ease-out;
        pointer-events: auto;
      }

      /* Idle: near-invisible dark lozenge. Brightens/expands slightly on
         hover so it reads as clickable (transform/opacity only). Hover
         emphasis (US-009): fully opaque + slight scale-up, still
         transform/opacity only, composing with the centering transform. */
      /* Idle is the app's dock icon: the Demod mark, not a blank lozenge. Same
         logo as the settings sidebar (index.html .app-icon) so the floating
         pill and the window read as one product. Kept small and dim so it
         stays unobtrusive on top of other apps, and it brightens on hover
         using transform/opacity only - never layout - so the fixed-size
         overlay window is untouched. */
      /* The layer itself is an INVISIBLE hover catcher, sized to the expanded
         pill - not to the 3px bar. A 3px-tall hover target is unhittable in
         practice, and it would also make the pill collapse the instant it
         expanded (cursor ends up outside the 3px strip), so hover would
         oscillate. Keeping the catcher at the expanded size means the box the
         cursor is in never changes. All paint moves to ::before, a pseudo-
         element - so this stays ONE element and `data-tauri-drag-region` plus
         the Rust hit test are unaffected. */
      .state-idle {
        width: var(--pill-idle-expand-w);
        height: var(--pill-idle-expand-h);
        border-radius: 999px;
        position: absolute; /* .layer already sets this; kept explicit so the
                                hotkey tooltip below can anchor off this box */
        background: none;
        border-color: transparent;
        box-shadow: none;
      }
      /* The visible pill. Collapsed to a hair-thin neon line at rest: at 3px
         tall a 1px border top+bottom would eat the whole box, so the bar is
         drawn as a filled neon line with no border, and the border only
         appears once it has expanded enough to hold one. */
      .state-idle::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: var(--pill-idle-bar-w);
        height: var(--pill-idle-bar-h);
        border-radius: 999px;
        /* BLACK middle, deep-purple OUTLINE (TJ 2026-07-21: "the actual color
           should still be black, but the outline should just be that deep
           purple border"). No glow at rest - the violet glow is the hover
           reward only, added back in the :hover rule below. */
        background: rgba(0, 0, 0, 0.9);
        border: 1px solid var(--pill-idle-bar-color);
        box-shadow: none;
        transition:
          width 180ms cubic-bezier(0.22, 1, 0.36, 1),
          height 180ms cubic-bezier(0.22, 1, 0.36, 1),
          background 180ms ease-out,
          border-color 180ms ease-out;
        /* animation intentionally NOT here - see the gated rule below. */
      }
      /* Pulse only while actually idle. Putting `animation` on the base
         ::before rule repainted the box-shadow every frame in EVERY state
         (listening/processing/etc), just invisibly behind an opacity:0 layer -
         wasted compositor work. Gating on the state confines it to when the bar
         is on screen. */
      /* No resting animation any more (TJ 2026-07-21). The bar sits perfectly
         flat and still - no breathing glow. The idle-pulse @keyframes below is
         kept only as documentation of the retired effect. */
      /* Border/glow "alive" pulse - CSS var-driven so the duration is a
         single source of truth in :root. Disabled entirely under reduced
         motion (see the media query near the bottom of this stylesheet). */
      @keyframes idle-pulse {
        0%, 100% {
          box-shadow:
            0 0 8px 1px var(--pill-idle-glow-inner),
            0 0 16px 3px var(--pill-idle-glow-outer);
        }
        50% {
          box-shadow:
            0 0 11px 2px var(--pill-idle-glow-inner),
            0 0 22px 5px var(--pill-idle-glow-outer-peak);
        }
      }
      /* Hidden at rest - nothing legible fits in a 3px bar. The mark is the
         reward for hovering. z-index lifts it above ::before, which is painted
         after the element's own background but below its children only once
         they establish a stacking position. */
      .state-idle .logo {
        width: 18px;
        height: 18px;
        opacity: 0;
        position: relative;
        z-index: 1;
        transition: opacity 140ms ease-out;
      }
      /* Reverted to an inline SVG on 2026-07-20. It had been a base64 raster
         PNG, which silently froze the OLD pre-rename mark into this file: the
         desktop icon and the settings sidebar both updated and the floating
         pill did not, because a data URI cannot follow a token. Inline SVG
         driven by --logo-color makes that drift impossible. Do not convert
         this back to a raster. Geometry is the same 5 bars as
         index.html .app-icon and src-tauri/icons/generate_icons.py. */
      .state-idle .logo rect {
        fill: var(--logo-color);
      }
      /* Hover: expand AND keep pulsing (TJ 2026-07-20 - "it should pulse as
         well as the expand animation"). The idle breathe animates box-shadow;
         this one animates transform, so it cannot simply inherit - a transform
         keyframe must restate the centering translate or the pill jumps to the
         window corner mid-animation. Declaring `animation` here also replaces
         idle-pulse, which is what lets the dimmer static box-shadow below
         actually take effect instead of being overwritten by the breathe. */
      /* Pulses the glow, NOT a transform scale (changed 2026-07-20). The old
         hover pulse scaled the pill up to 1.19x. Once hover expands the pill to
         180px that would sweep it out to 214px - past the 200px Rust hit rect -
         so the cursor would fall outside the interactive region at the pill's
         own edge, collapsing it, re-entering, and flickering forever. Glow has
         no such coupling because box-shadow is not hit-tested. */
      @keyframes hover-pulse {
        0%, 100% {
          box-shadow:
            0 0 6px 1px var(--pill-idle-glow-inner-hover),
            0 0 12px 2px var(--pill-idle-glow-outer-hover);
        }
        50% {
          box-shadow:
            0 0 9px 2px var(--pill-idle-glow-inner-hover),
            0 0 18px 4px var(--pill-idle-glow-outer-hover);
        }
      }
      /* Hover expands the bar into the recording pill's exact box, so the
         gesture previews the shape recording will take. This animates
         width/height rather than a transform: a transform cannot turn a 64x5
         bar into a 180x36 lozenge without smearing the border-radius and the
         mark (non-uniform ~2.8x by 7x). The usual objection to animating layout
         does not apply here - this element is absolutely positioned, alone, and
         centered inside a fixed-size overlay window, so nothing reflows and the
         window never resizes. */
      #mic[data-state="idle"] .state-idle:hover::before {
        width: var(--pill-idle-expand-w);
        height: var(--pill-idle-expand-h);
        background: var(--pill-idle-bg-hover);
        border-color: var(--pill-idle-border);
        /* Hover reveals the pill: a SINGLE static violet edge-glow, no looping
           pulse (TJ 2026-07-21 wants the glow gone from the resting bar; on
           hover a quiet static halo just lifts the dock off the desktop). */
        box-shadow: 0 0 10px 1px var(--pill-idle-glow-inner-hover);
      }
      #mic[data-state="idle"] .state-idle:hover .logo {
        opacity: 1;
      }

      /* Hotkey hover tooltip (idle only). Purely decorative overlay - never
         affects the pill's own width/height, so the fixed-size host window
         and drag-region hit test are untouched. Positioned above the pill,
         shown/hidden via opacity + transform only. Text is filled at runtime
         from get_settings(); left empty (nothing shown) until it resolves. */
      .idle-hotkey {
        position: absolute;
        left: 50%;
        bottom: calc(100% + 8px);
        transform: translateX(-50%) translateY(4px);
        white-space: nowrap;
        font-size: 11px;
        color: #d8d8d8;
        background: rgba(24, 24, 24, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        padding: 4px 8px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 120ms ease-out, transform 120ms ease-out;
      }
      #mic[data-state="idle"] .state-idle:hover .idle-hotkey.has-hotkey {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* Strengthened hover for the active (non-idle) layers: fully opaque,
         slightly larger, transform/opacity only. */
      .layer:hover {
        background: rgba(20, 20, 20, 0.95);
      }
      /* Idle opts OUT of the generic hover darkening. Its layer is a
         transparent hit catcher sized to the EXPANDED pill, so letting the
         generic rule fill it would paint a 180x36 slab on hover instead of the
         bar growing into one. Idle's hover paint lives entirely on ::before. */
      #mic[data-state="idle"] .state-idle:hover {
        background: none;
      }
      /* Listening must stay red even on hover - overrides the generic
         .layer:hover darkening above (loaded later, so it wins by source
         order without needing !important). */
      #mic[data-state="listening"] .state-listening:hover {
        background: var(--pill-recording-bg-hover);
        box-shadow: 0 0 14px 2px var(--pill-recording-glow-hover);
      }
      #mic[data-state="listening"] .state-listening:hover,
      #mic[data-state="processing"] .state-processing:hover,
      #mic[data-state="done"] .state-done:hover {
        transform: translate(-50%, -50%) scale(1.04);
      }

      /* Confirm-discard (US-006): shown after the first Esc past the 30s
         guard; second Esc within 3s discards. */
      .state-confirm-discard {
        width: 220px;
        height: 36px;
        padding: 0 14px;
        font-size: 12px;
        color: #f2b8b8;
        white-space: nowrap;
      }

      /* Transient notice: same lozenge shape as paste-fallback, but its text
         is set at runtime and it auto-reverts to idle. Used to report why a
         quick-menu action could not run, rather than failing silently. */
      .state-notice {
        width: 240px;
        height: 36px;
        padding: 0 14px;
        font-size: 12px;
        color: #d8d8d8;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Paste-fallback (US-007): shown when refocus/paste fails; transcript
         stays on the clipboard until the next state change. */
      .state-paste-fallback {
        width: 240px;
        height: 36px;
        padding: 0 14px;
        font-size: 12px;
        color: #d8d8d8;
        white-space: nowrap;
      }

      /* Status dot (US-008): 8px dot pinned to the pill's corner, visible
         only on the layers that carry state (listening/processing/done).
         Color driven by #mic[data-dot] via CSS vars; crossfaded via
         opacity only, never removed from the DOM. */
      .status-dot {
        position: absolute;
        top: -2px;
        right: -2px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--dot-color, transparent);
        opacity: 0;
        transition: opacity 150ms ease-out, background-color 150ms ease-out;
        pointer-events: none;
      }
      #mic[data-state="listening"] .state-listening .status-dot,
      #mic[data-state="processing"] .state-processing .status-dot,
      #mic[data-state="done"] .state-done .status-dot {
        opacity: 1;
      }
      #mic[data-dot="starting"] .status-dot { --dot-color: #e0c341; }
      #mic[data-dot="processing"] .status-dot { --dot-color: #4a9ff5; }
      #mic[data-dot="done"] .status-dot { --dot-color: #6fe08c; }
      #mic[data-dot="off"] .status-dot,
      #mic:not([data-dot]) .status-dot { opacity: 0; }

      /* Listening: red pill (mic is unmistakably live) containing a flowing
         waveform canvas driven by real mic RMS. The canvas is redrawn each
         rAF frame (transform/opacity-equivalent - a canvas redraw never
         touches layout), never resized here; only its 2D content changes. */
      .state-listening {
        width: 104px;
        height: 28px;
        gap: 6px;
        background: var(--pill-recording-bg);
        border-color: var(--pill-recording-border);
        box-shadow: 0 0 10px 1px var(--pill-recording-glow);
      }
      /* Narrowed from 160 to 128 to make room for the X-circle cancel button
         WITHOUT growing the pill - the recording pill stays the same 180x36 box
         (TJ 2026-07-21: "these sizes should not change ... same rectangular
         pill"). Keep CSS_W in the renderer JS in sync with this width. */
      .state-listening canvas.waveform {
        width: 44px;
        height: 20px;
      }
      /* Processing/loading uses the SAME 21st.dev "Wave" bars as recording
         (TJ 2026-07-21: the SiriWave WebGL read too small and glitched, so it
         was dropped entirely). Self-animated - there is no mic input during the
         transcription wait, so it is an honest busy indicator, not a fake level. */
      .state-processing canvas.waveform-proc {
        width: 44px;
        height: 20px;
      }
      /* X-circle CANCEL (TJ 2026-07-21): discard an in-progress recording so it
         is never transcribed or pasted anywhere. This is the ONE interactive
         child of the pill: `.layer * { pointer-events: none }` keeps the OS
         drag-region hit test on the layer, so this child re-enables
         pointer-events to be clickable. Magenta reads as "stop", distinct from
         the violet waveform. */
      .state-listening .cancel-btn {
        pointer-events: auto;
        flex: 0 0 auto;
        width: 22px;
        height: 22px;
        padding: 0;
        margin: 0;
        border: none;
        background: transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .state-listening .cancel-btn svg {
        width: 18px;
        height: 18px;
      }
      .state-listening .cancel-btn svg circle {
        fill: none;
        stroke: var(--color-neon-magenta);
        stroke-width: 2;
      }
      .state-listening .cancel-btn svg line {
        stroke: var(--color-neon-magenta);
        stroke-width: 2;
        stroke-linecap: round;
      }
      .state-listening .cancel-btn:hover svg circle,
      .state-listening .cancel-btn:hover svg line {
        stroke: var(--color-neon-white);
      }

      /* Processing: the Wave bars, self-animated while transcription runs
         (replaced the old 3-dot pulse). */
      .state-processing {
        width: 96px;
        height: 28px;
        gap: 6px;
      }

      /* Done: brief success tick. */
      .state-done {
        width: 64px;
        height: 36px;
      }
      .state-done svg {
        width: 18px;
        height: 18px;
        stroke: #6fe08c;
        stroke-width: 2.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Right-click quick menu (US-009): grows upward from the pill,
         transform-origin bottom center, scale + opacity only, ~120ms.
         Positioned above the pill, within the 440x160 host bounds. */
      #quick-menu {
        position: fixed;
        left: 50%;
        bottom: 64px;
        transform: translateX(-50%) scale(0.95);
        transform-origin: bottom center;
        display: flex;
        flex-direction: column;
        min-width: 170px;
        background: rgba(24, 24, 24, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 10px;
        padding: 4px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 120ms ease-out, transform 120ms ease-out;
      }
      #quick-menu[data-open="true"] {
        opacity: 1;
        transform: translateX(-50%) scale(1);
        pointer-events: auto;
      }
      #quick-menu .menu-item {
        appearance: none;
        border: none;
        background: transparent;
        color: #eaeaea;
        font-family: inherit;
        font-size: 12.5px;
        text-align: left;
        padding: 7px 10px;
        border-radius: 6px;
        cursor: pointer;
      }
      #quick-menu .menu-item:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      /* Reduced motion (US-006/waveform): fall back to a calm static bar
         showing the current level as a fixed-width fill, no scrolling/flow.
         The JS render loop checks this same query and skips the scroll
         phase + redraw cadence; this class only affects the flatline look
         drawn once. */
      @media (prefers-reduced-motion: reduce) {
        .state-listening canvas.waveform,
        .state-processing canvas.waveform-proc {
          opacity: 0.9;
        }
        .state-idle::before {
          animation: none;
          /* Rest is flat + glowless now, so reduced-motion matches the default
             look; only the expand transition is dropped so it snaps. */
          box-shadow: none;
          transition: none;
        }
        /* Keep the quiet static hover halo (an affordance, not motion). */
        #mic[data-state="idle"] .state-idle:hover::before {
          box-shadow: 0 0 10px 1px var(--pill-idle-glow-inner-hover);
        }
      }
    </style>
  </head>
  <body>
    <div id="mic" data-state="idle">
      <div class="layer state-idle" data-tauri-drag-region>
        <svg
          class="logo"
          viewBox="0 0 24 24"
          aria-hidden="true"
          data-tauri-drag-region
        >
          <rect x="0.5"  y="9"   width="3" height="6"  rx="1.4"/>
          <rect x="5.5"  y="5"   width="3" height="14" rx="1.4"/>
          <rect x="10.5" y="1.5" width="3" height="21" rx="1.4"/>
          <rect x="15.5" y="5"   width="3" height="14" rx="1.4"/>
          <rect x="20.5" y="9"   width="3" height="6"  rx="1.4"/>
        </svg>
        <div class="idle-hotkey" id="idle-hotkey"></div>
      </div>
      <div class="layer state-listening" data-tauri-drag-region>
        <canvas class="waveform" width="320" height="56"></canvas>
        <button
          class="cancel-btn"
          type="button"
          aria-label="Cancel recording"
          title="Cancel — discard this recording"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <line x1="8.5" y1="8.5" x2="15.5" y2="15.5" />
            <line x1="15.5" y1="8.5" x2="8.5" y2="15.5" />
          </svg>
        </button>
        <div class="status-dot"></div>
      </div>
      <div class="layer state-processing" data-tauri-drag-region>
        <canvas class="waveform-proc" width="320" height="56"></canvas>
        <div class="status-dot"></div>
      </div>
      <div class="layer state-done" data-tauri-drag-region>
        <svg viewBox="0 0 24 24"><polyline points="5 12.5 10 17.5 19 7"/></svg>
        <div class="status-dot"></div>
      </div>
      <div class="layer state-confirm-discard" data-tauri-drag-region>
        <span>Discard? press Esc again</span>
      </div>
      <!-- Transient message layer. A quick-menu action that fails (e.g. "Paste
           last transcript" with nothing recorded yet) reports the reason here
           instead of appearing to do nothing. -->
      <div class="layer state-notice" data-tauri-drag-region>
        <span id="notice-text"></span>
      </div>
      <div class="layer state-paste-fallback" data-tauri-drag-region>
        <span>Copied &mdash; press Ctrl+V to paste</span>
      </div>
    </div>
    <div id="quick-menu" data-open="false" role="menu">
      <button class="menu-item" type="button" data-action="menu_hide_hour">Hide for 1 hour</button>
      <button class="menu-item" type="button" data-action="menu_paste_last">Paste last transcript</button>
      <button class="menu-item" type="button" data-action="menu_open_settings">Settings</button>
      <button class="menu-item" type="button" data-action="menu_quit">Quit</button>
    </div>
    <script>
      // Waveform renderer: real mic RMS pushed from Rust (audio.rs emits
      // 'audio-level', a single float, at <=30Hz while recording). One rAF
      // loop runs ONLY while data-state=listening (started/stopped by a
      // MutationObserver on the attribute - event-driven, no polling, and it
      // is naturally paused whenever the window is hidden/occluded since
      // requestAnimationFrame itself pauses then - the loop never assumes a
      // frame actually painted). Drawn as a flowing waveform on a canvas: a
      // canvas redraw is a pixel operation, never a layout-affecting CSS
      // property, so it is as safe as the old transform: scaleY approach.
      //
      // Fourth attempt (see tasks/lessons.md). Attempts 1-3 each failed the
      // same requirement from a different direction: (1) a modulated-in-place
      // sine never travelled; (2) a coarse ring buffer DID flatline at
      // silence, but the speaking state was near-invisible; (3) over-corrected
      // into a permanent IDLE_AMP floor that could never read as flat - which
      // is the thing TJ has now rejected repeatedly ("it needs to be a
      // straight line", "make it a heart rate monitor").
      //
      // This build is an ECG/oscilloscope trace, which satisfies BOTH halves
      // at once instead of trading one against the other: a scrolling buffer
      // of REAL mic samples, hard-gated to exactly 0 below SILENCE_GATE (a
      // dead-flat baseline, immune to mic self-noise jitter) and deflecting to
      // full pill height on speech (unmistakable - fixes attempt 2's
      // invisibility). Scroll is dt-driven from performance.now() deltas, so
      // it stays correct immediately after any rAF pause from window
      // occlusion, and never accumulates drift.
      //
      // Do NOT reintroduce an idle amplitude floor. "Flat" must mean flat.
      (() => {
        // Silence gate + whisper/talk boundary are user-tunable (Settings ->
        // "Voice detection"). Defaults match the shipped values and are
        // overwritten from get_settings (voiceSensitivity / whisperThreshold)
        // at load and at each recording start, so nothing here is hardcoded for
        // real - the app reads the user's numbers.
        let silenceGate = 0.035;       // curved level at/below this is TRUE silence -> exactly 0 -> a straight line
        let whisperThreshold = 0.5;    // loudness (0..1) below = whisper (wave), above = talking (bars)
        const PEAK_FLOOR = 0.02;     // adaptive-peak floor - keeps quiet-room mic noise from being amplified into fake motion
        const PEAK_RELEASE_MS = 450; // TJ 2026-07-20: "it doesn't return back to normal" - settle to baseline in ~400-600ms, then hold
        const LEVEL_CURVE = 0.42;    // exponent <1 = aggressive early rise, so quiet speech still deflects the trace a lot
        const PX_PER_SAMPLE = 2;     // ~1 sample per 2 CSS px of pill width
        const SCROLL_PX_PER_S = 96;  // sample-history travel speed across the meter

        // --- whisper (wave) vs talking (bars) mode selection ---
        // The peak-normalized 'curved' value re-references each utterance's own
        // peak, so it CANNOT tell a whisper from loud speech (a whisper's own
        // peak normalizes back to ~1). Mode selection therefore uses the RAW
        // absolute level, smoothed, scaled to 0..1 by a fixed talk reference,
        // and compared to whisperThreshold with a hysteresis dead-band so it
        // does not flicker at the boundary.
        const TALK_REF = 0.15;          // raw RMS mapped to loudness 1.0 (a normal speaking level)
        const MODE_SMOOTH_ALPHA = 0.15; // per-frame smoothing of the raw level driving the mode
        const MODE_HYST = 0.08;         // dead-band on each side of whisperThreshold
        const WAVE_CYCLES = 3.0;        // sine periods drawn across the whisper wave
        const WAVE_SPEED = 6.0;         // rad/s the whisper wave travels
        // (UNDERSHOOT removed: it drew each deflection partly below the baseline
        // for the old heartbeat stroke. Bars are centered on the midline now, so
        // there was nothing reading it.)

        const mic = document.getElementById('mic');
        const canvas = document.querySelector('.state-listening canvas.waveform');
        const ctx = canvas ? canvas.getContext('2d') : null;
        const reduceMotion = window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // CSS-pixel canvas size (fixed layout size); device-pixel backing
        // store is sized from devicePixelRatio so the stroke stays crisp on
        // hi-DPI displays instead of blurring the old statically-baked 2x
        // canvas attributes.
        const CSS_W = 44, CSS_H = 20;  // CSS_W/H must match .state-listening canvas.waveform in the CSS above
        let dpr = 1;
        const fitCanvasToDPR = () => {
          if (!canvas || !ctx) return;
          dpr = window.devicePixelRatio || 1;
          const targetW = Math.round(CSS_W * dpr);
          const targetH = Math.round(CSS_H * dpr);
          if (canvas.width !== targetW) canvas.width = targetW;
          if (canvas.height !== targetH) canvas.height = targetH;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // draw in CSS-pixel coordinates from here on
        };

        let level = 0;             // latest RMS from Rust (untouched - display only reads this, never mutates it)
        let peakEnv = PEAK_FLOOR;  // slow-moving adaptive peak (instant attack, seconds-scale release)
        let rafId = 0;
        let lastNow = 0;
        let mode = 'wave';         // 'wave' (whisper) | 'bars' (talking); starts quiet
        let smoothRaw = 0;         // smoothed RAW level, only for the mode decision
        let wavePhase = 0;         // travelling phase for the whisper wave

        // ECG strip: one deflection magnitude (0..1) per sample column, oldest
        // at index 0 (left edge). Zero-filled, so a fresh start and a silent
        // room both render as an exactly straight line rather than as noise.
        const SAMPLE_COUNT = Math.max(48, Math.ceil(CSS_W / PX_PER_SAMPLE)) + 1;
        const samples = new Float32Array(SAMPLE_COUNT);
        let sampleCarry = 0;  // fractional samples owed from the last frame - keeps scroll speed dt-exact
        let lastDrawNow = 0;  // timestamp of the previous drawFrame, for dt-exact scrolling

        // Shift the strip left by n columns and write the current deflection
        // into the newest ones. Separate from drawing so the test harness can
        // drive it deterministically.
        const pushSamples = (n, value) => {
          if (n <= 0) return;
          if (n >= SAMPLE_COUNT) {
            samples.fill(value);
            return;
          }
          samples.copyWithin(0, n);
          samples.fill(value, SAMPLE_COUNT - n);
        };

        // Single flat stroke color (TJ 2026-07-20: "why is it gradient? It
        // should just be one color for the wavelength"). Never a literal
        // here - read from the :root custom property (--wave-stroke) so the
        // single source of truth for every color in this file stays :root,
        // per project rule.
        const rootStyle = getComputedStyle(document.documentElement);
        const cssVar = (name, fallback) => {
          const v = rootStyle.getPropertyValue(name).trim();
          return v || fallback;
        };
        const strokeColor = cssVar('--wave-stroke', '#b14dff'); // matches --color-neon-violet, the real token value
        // Only the faint lift is read by the renderer now. The old full-strength
        // --wave-glow-color const was removed as dead code (its cyan fallback was
        // itself a stale wrong hue); the token stays in :root as documentation of
        // the pre-"faint" value. See the glow note in drawFrame before changing.
        const glowFaint = cssVar('--wave-glow-faint', 'rgba(177, 77, 255, 0.2)');
        const GLOW_BLUR = 2.5;

        // Deflection for one column. Below the gate this returns EXACTLY 0 so
        // the trace is a true straight line at silence - not a small residual
        // wobble from mic self-noise, which is what "it's not a straight line"
        // has meant every time.
        const deflection = (curved) => (curved <= silenceGate ? 0 : (curved - silenceGate) / (1 - silenceGate));

        // Turns a raw 0..1-ish RMS level into the normalized 0..1 "curved"
        // drive value used for both amplitude and wavelength - a single
        // adaptive-peak + non-linear-curve computation shared by the live
        // rAF loop and the manual/test-harness path, so both agree.
        const levelToCurve = (lvl) => {
          const absLevel = Math.max(lvl, 0);
          if (absLevel > peakEnv) {
            peakEnv = absLevel;
          } else {
            peakEnv = Math.max(peakEnv, PEAK_FLOOR);
          }
          const norm = Math.min(1, absLevel / Math.max(peakEnv, PEAK_FLOOR));
          return Math.pow(norm, LEVEL_CURVE);
        };

        // Exposed so a standalone test harness can call it directly with an
        // explicit timestamp + level, bypassing rAF entirely (rAF is paused
        // whenever the host window is occluded/backgrounded, so relying on
        // it for verification screenshots is unreliable).
        const drawFrame = (now, lvl) => {
          if (!ctx || !canvas) return;
          fitCanvasToDPR();
          const mid = CSS_H / 2;
          const ampScale = mid * 0.86;

          const curved = levelToCurve(lvl);
          const d = deflection(curved);

          // Advance the strip by wall-clock time, not by frame count, so the
          // scroll speed is identical at 30fps, 60fps, 144fps, and after an
          // rAF pause. Fractional columns carry over instead of being lost.
          const dtMs = lastDrawNow ? Math.min(now - lastDrawNow, 250) : 0;
          lastDrawNow = now;
          const advance = (dtMs / 1000) * SCROLL_PX_PER_S / PX_PER_SAMPLE + sampleCarry;
          const whole = Math.floor(advance);
          sampleCarry = advance - whole;
          if (!reduceMotion) pushSamples(whole, d);

          // Whisper(wave) vs talking(bars), from the RAW absolute level - see
          // the TALK_REF note above for why 'curved' can't be used here.
          const absRaw = Math.max(lvl, 0);
          smoothRaw += (absRaw - smoothRaw) * MODE_SMOOTH_ALPHA;
          const loudness = Math.min(1, smoothRaw / TALK_REF);
          if (mode === 'bars' && loudness < whisperThreshold - MODE_HYST) mode = 'wave';
          else if (mode === 'wave' && loudness > whisperThreshold + MODE_HYST) mode = 'bars';
          if (!reduceMotion) wavePhase += (dtMs / 1000) * WAVE_SPEED;

          ctx.clearRect(0, 0, CSS_W, CSS_H);
          // (Removed lineWidth/lineCap/lineJoin here: they configured the old
          // stroked ECG trace. The renderer now fills bars with roundRect+fill()
          // and never calls stroke(), so that line state was dead every frame.)
          // Glow: allowed again, but only barely (TJ 2026-07-20: "it should
          // only be very faint like the lowest level"). This REVERSES the older
          // "no shadowBlur, ever" rule that used to sit here, so the history
          // matters or someone will delete this as a regression: a glow was
          // twice rejected for reading as a gradient ("why is it gradient?",
          // then "still a gradient color and not a solid deep color"). What
          // made it read that way was a WIDE, STRONG bloom fading the bar out
          // to a soft edge. At blur 2.5 with ~0.2 alpha the bar keeps a hard
          // edge and the halo only lifts it off the pill background, which is
          // the effect he approved from the comparison panel.
          //
          // So the constraint is not "no glow" but "no bloom big enough to
          // soften the bar's edge". If it ever reads as a gradient again, cut
          // --wave-glow-faint's alpha or the blur radius; do not just delete
          // the glow and re-add the absolute ban.
          // BARS, not a stroked trace (TJ 2026-07-20, final call: "use the sound
          // bars that adjust height based on voice sensitivity"). The ECG line
          // and the travelling sine before it were both rejected on look. A bar
          // meter is what the original US-003 shipped and what he wants back.
          //
          // He also asked for "a sound frequency" look. Be honest about what is
          // actually available: audio.rs emits ONE RMS amplitude float, not an
          // FFT, so there are no real frequency bands to show. Faking bands from
          // a single amplitude would be invented telemetry. Instead each bar
          // reads a different column of the real sample history, so the meter
          // shows amplitude over a short rolling window - genuinely derived,
          // and it reads like a level meter rather than a bar chart of nothing.
          ctx.fillStyle = strokeColor;
          ctx.shadowColor = glowFaint;
          ctx.shadowBlur = GLOW_BLUR;

          // DISCRETE BARS ONLY (TJ 2026-07-21, final): the sine/whisper wave is
          // removed - it read as a flat line whose pitch changed but never
          // travelled. The bars below are the single recording animation for
          // both quiet and loud speech; bar heights already scale with the live
          // mic level, so whispering shows short bars and talking shows tall
          // ones (still dynamic, just no separate wave mode).

          // Bar/gap proportions measured 2026-07-20 from Wispr Flow's own
          // assets, not chosen by eye: Wispr's live web demo ships
          // `.wd_pill-bar { width: 2px; gap: 2px; border-radius: 1000px }`, and
          // their marketing render measures 3-4px bars with 4-5px gaps. Ours
          // were ~5.9px, which read as fat blocks rather than a meter.
          //
          // Count/pitch are a faithful port of the comparison panel TJ picked
          // (2026-07-20 screenshot): 3px bars on a ~12px pitch, i.e. gaps ~3x
          // the bar width. That panel was drawn 640px wide; at this canvas's
          // real 160px the same pitch is 13 bars, NOT the ~42 it showed. The
          // thin-bar-wide-gap RATIO is what he liked, so the ratio ports, not
          // the count - and Wispr's own count varies by source anyway (10 in
          // the demo, 18 in the render), so it is not load-bearing.
          //
          // NOTE: do NOT also copy their motion. Wispr's bars rise in place,
          // staggered by CSS nth-child delays - decorative animation that is
          // audio-independent. Ours are driven by real RMS, and the per-bar
          // history read below is what keeps them from pumping in unison
          // honestly rather than by faking offsets.
          // Compact 5-bar cluster - the 21st.dev @loading-ui "Wave" component
          // (TJ 2026-07-21, from the screenshot): a small centered equalizer
          // glyph, NOT a wide meter. Bars are rounded rectangles, centered.
          const BAR_COUNT = 5;
          const barW = 4;
          const gap = 4;
          const cluster = BAR_COUNT * barW + (BAR_COUNT - 1) * gap;  // 36px
          const x0 = (CSS_W - cluster) / 2;                          // centered in the canvas
          const radius = 2;                                          // rounded rectangles, not full pills
          const MIN_H = 3;                                           // resting height - silence still reads as bars

          for (let b = 0; b < BAR_COUNT; b++) {
            // Flowing bar animation ported from the 21st.dev "Waveform" React
            // component (TJ 2026-07-21): each bar's height is two phase-shifted
            // sines plus a little noise, driven by wall-clock time so the bars
            // TRAVEL in a live wave (not just a static level meter). Then scaled
            // by the real mic level (d) so quiet reads gentle and speaking fills
            // the meter. Reduced-motion drops the time-driven flow.
            let combined;
            if (reduceMotion) {
              combined = 0.5;
            } else {
              const w1 = Math.sin(now * 0.0036 + b * 0.5) * 0.5 + 0.5;
              const w2 = Math.sin(now * 0.006 + b * 0.3 + 2) * 0.3 + 0.3;
              const noise = Math.random() * 0.2;
              combined = (w1 + w2 + noise) / 1.5;   // ~0..1, flowing
            }
            const amp = reduceMotion ? Math.max(0.3, d) : 0.3 + d * 0.7;
            const h = Math.max(MIN_H, combined * amp * (CSS_H - 2));
            const x = x0 + b * (barW + gap);
            const y = mid - h / 2;

            ctx.beginPath();
            ctx.roundRect(x, y, barW, h, radius);
            ctx.fill();
          }
        };

        const frame = (now) => {
          const dt = lastNow ? now - lastNow : 16;
          lastNow = now;
          // Frame-rate-independent exponential smoothing of the peak
          // envelope's release, driven by wall-clock dt rather than a fixed
          // per-frame step, so it behaves the same whether rAF just resumed
          // after a long pause or is running at 60fps. The actual draw call
          // below re-derives amp/cycles from the *current* level each frame
          // (levelToCurve), which is itself gated by the slow-moving peak
          // envelope - that IS the smoothing; a separate smoothLevel lerp on
          // top would just double-smooth, so drawFrame is the single source
          // of truth here.
          const absLevel = Math.max(level, 0);
          if (absLevel > peakEnv) {
            peakEnv = absLevel;
          } else {
            const releaseAlpha = 1 - Math.exp(-dt / PEAK_RELEASE_MS);
            peakEnv += (Math.max(absLevel, PEAK_FLOOR) - peakEnv) * releaseAlpha;
          }
          peakEnv = Math.max(peakEnv, PEAK_FLOOR);

          drawFrame(now, level);
          rafId = requestAnimationFrame(frame);
        };

        // Pull the user's silence gate + whisper threshold from settings.
        // Called at load and again at each recording start, so a change made in
        // the Settings window applies to the next dictation without a restart.
        const refreshThresholds = () => {
          const t = window.__TAURI__;
          if (!t || !t.core || typeof t.core.invoke !== 'function') return;
          t.core.invoke('get_settings').then((s) => {
            if (s && typeof s.voiceSensitivity === 'number') silenceGate = s.voiceSensitivity;
            if (s && typeof s.whisperThreshold === 'number') whisperThreshold = s.whisperThreshold;
          }).catch(() => {});
        };

        const startLoop = () => {
          if (rafId) return;
          refreshThresholds();
          level = 0;
          lastNow = 0;
          lastDrawNow = 0;
          sampleCarry = 0;
          samples.fill(0); // open on a straight line, never on stale peaks from the previous recording
          peakEnv = PEAK_FLOOR;
          mode = 'wave';
          smoothRaw = 0;
          wavePhase = 0;
          rafId = requestAnimationFrame(frame);
        };

        const stopLoop = () => {
          if (!rafId) return;
          cancelAnimationFrame(rafId);
          rafId = 0;
          lastDrawNow = 0;
          sampleCarry = 0;
          samples.fill(0);
          peakEnv = PEAK_FLOOR;
          mode = 'wave';
          smoothRaw = 0;
          wavePhase = 0;
          if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
        };

        new MutationObserver(() => {
          if (mic.dataset.state === 'listening') startLoop();
          else stopLoop();
        }).observe(mic, { attributes: true, attributeFilter: ['data-state'] });

        // Rust emits with emit_to("overlay", ...): label-targeted events do
        // NOT reach target-Any listeners (plain event.listen), so listen on
        // this window's own target.
        const tauri = window.__TAURI__;
        if (tauri && tauri.webviewWindow) {
          tauri.webviewWindow.getCurrentWebviewWindow().listen('audio-level', (e) => {
            level = e.payload;
          });
        }
        // Load the user's thresholds once at startup too (startLoop refreshes
        // them again at each recording), so the very first dictation already
        // honours the settings rather than the defaults.
        refreshThresholds();

        // Expose the pure draw function for the standalone visual-proof test
        // harness (never used by the app itself) to call directly with
        // explicit timestamps/levels, since rAF pauses when this window is
        // occluded and cannot be trusted to paint on demand.
        window.__demodWaveformDrawFrame = drawFrame;
        // Standalone browser preview (no Tauri backend): expose a level setter
        // and auto-enter the listening state on ?demo, so the meter animates
        // from synthetic input for design iteration in a plain browser.
        window.__demodSetLevel = (v) => { level = Math.max(0, +v || 0); window.__demodMicLevel = level; };
        if (location.search.includes('demo')) mic.dataset.state = 'listening';
      })();

      // Processing / loading animation: the SAME 21st.dev "Wave" bars as the
      // recording pill, self-animated (TJ 2026-07-21: the SiriWave WebGL was too
      // small and glitched, so both SiriWave renderers were removed and the pill
      // now uses ONE animation everywhere). There is no mic input during the
      // transcription wait, so the bars run on wall-clock time at a lively fixed
      // amplitude - an honest "working" indicator, not a faked level readout.
      // Runs only while data-state=processing; rAF pauses when the window hides.
      (() => {
        const mic = document.getElementById('mic');
        const canvas = document.querySelector('.state-processing canvas.waveform-proc');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        const reduceMotion = window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const CSS_W = 44, CSS_H = 20;  // must match .state-processing canvas.waveform-proc
        const rootStyle = getComputedStyle(document.documentElement);
        const strokeColor = (rootStyle.getPropertyValue('--wave-stroke').trim() || '#b14dff');
        const glowFaint = (rootStyle.getPropertyValue('--wave-glow-faint').trim() || 'rgba(177, 77, 255, 0.2)');
        const BAR_COUNT = 5;             // Molecule UI "Wave Loader": 5 vertical bars scaling in a wave
        const barW = 4;
        const gap = 4;
        const cluster = BAR_COUNT * barW + (BAR_COUNT - 1) * gap;
        const x0 = (CSS_W - cluster) / 2;
        const radius = 2;
        const MIN_H = 3;

        let dpr = 1;
        const fit = () => {
          dpr = window.devicePixelRatio || 1;
          const w = Math.round(CSS_W * dpr), h = Math.round(CSS_H * dpr);
          if (canvas.width !== w) canvas.width = w;
          if (canvas.height !== h) canvas.height = h;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        };

        // Wave Loader: each bar scales its height up/down, staggered by index
        // so the scale-wave travels across the cluster. Decorative (no mic
        // during the transcription wait) - an honest "working" indicator.
        const draw = (now) => {
          fit();
          const mid = CSS_H / 2;
          ctx.clearRect(0, 0, CSS_W, CSS_H);
          ctx.fillStyle = strokeColor;
          ctx.shadowColor = glowFaint;
          ctx.shadowBlur = 2.5;
          for (let b = 0; b < BAR_COUNT; b++) {
            const scale = reduceMotion
              ? 0.6
              : 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(now * 0.007 - b * 0.9));
            const h = Math.max(MIN_H, scale * (CSS_H - 2));
            const x = x0 + b * (barW + gap);
            const y = mid - h / 2;
            ctx.beginPath();
            ctx.roundRect(x, y, barW, h, radius);
            ctx.fill();
          }
        };

        let rafId = 0;
        const frame = (now) => {
          if (mic.dataset.state !== 'processing') {
            rafId = 0;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            return;
          }
          draw(now);
          rafId = requestAnimationFrame(frame);
        };
        const enter = () => {
          if (reduceMotion) { draw(performance.now()); return; } // static readout, no loop
          if (!rafId) rafId = requestAnimationFrame(frame);
        };
        new MutationObserver(() => {
          if (mic.dataset.state === 'processing') enter();
        }).observe(mic, { attributes: true, attributeFilter: ['data-state'] });
        if (location.search.includes('demo') && mic.dataset.state === 'processing') enter();
      })();

      // X-circle cancel button (TJ 2026-07-21). Discards an in-progress
      // recording so it is never transcribed or pasted. The button is the one
      // child of the recording pill with pointer-events re-enabled; mousedown
      // is stopped from bubbling so it never starts a pill drag, and the click
      // invokes the Rust `cancel_recording` command (reuses the Esc-cancel path,
      // returns the pill to idle).
      (() => {
        const btn = document.querySelector('.state-listening .cancel-btn');
        if (!btn) return;
        btn.addEventListener('mousedown', (e) => {
          e.stopPropagation();
        });
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const tauri = window.__TAURI__;
          if (tauri && tauri.core && typeof tauri.core.invoke === 'function') {
            tauri.core.invoke('cancel_recording').catch((err) => {
              console.error('[Demod] cancel_recording failed:', err);
            });
          }
        });
      })();

      // Status dot (US-008): Rust emits 'status-dot' with payload
      // 'starting' | 'processing' | 'done' | 'off'. Stored as #mic
      // dataset.dot; CSS keys off [data-dot=...] and crossfades opacity
      // only. Same window-scoped listener pattern as 'audio-level'.
      (() => {
        const mic = document.getElementById('mic');
        const tauri = window.__TAURI__;
        if (tauri && tauri.webviewWindow) {
          tauri.webviewWindow.getCurrentWebviewWindow().listen('status-dot', (e) => {
            mic.dataset.dot = e.payload;
          });
        }
      })();

      // Failed dictation notice. Rust reports a dictation that could not
      // finish here, so the pill says what happened instead of sitting in an
      // animation forever. Delivered as an event payload assigned with
      // textContent, never interpolated into an eval string - engine and
      // network errors are not our text to trust.
      (() => {
        const mic = document.getElementById('mic');
        const tauri = window.__TAURI__;
        if (!tauri || !tauri.webviewWindow) return;
        let timer = null;
        tauri.webviewWindow.getCurrentWebviewWindow().listen('notice', (e) => {
          const el = document.getElementById('notice-text');
          if (!el) return;
          el.textContent = String(e.payload || '');
          mic.dataset.state = 'notice';
          if (timer) clearTimeout(timer);
          // Revert only if nothing else has changed state meanwhile, so a
          // dictation started during the notice is never clobbered.
          timer = setTimeout(() => {
            if (mic.dataset.state === 'notice') mic.dataset.state = 'idle';
          }, 3200);
        });
      })();

      // Right-click quick menu (US-009). All commands are now backed by real
      // Rust handlers in main.rs / pill_hittest.rs; invoke() stays wrapped in
      // .catch to avoid an uncaught rejection if a call ever fails.
      (() => {
        const mic = document.getElementById('mic');
        const menu = document.getElementById('quick-menu');

        // US-009: tell pill_hittest.rs when the menu is open so it widens the
        // OS-level hit rect (data-menu="open") - without this, the pointer
        // moving off the narrow pill rect onto the menu above it would flip
        // the overlay back to click-through and the menu would become
        // unclickable / dismiss itself.
        const reportMenuOpen = (open) => {
          const tauri = window.__TAURI__;
          if (tauri && tauri.core && typeof tauri.core.invoke === 'function') {
            tauri.core.invoke('set_menu_open', { open }).catch(() => {});
          }
        };

        const openMenu = () => {
          menu.dataset.open = 'true';
          mic.dataset.menu = 'open';
          reportMenuOpen(true);
        };
        const closeMenu = () => {
          menu.dataset.open = 'false';
          delete mic.dataset.menu;
          reportMenuOpen(false);
        };
        const isOpen = () => menu.dataset.open === 'true';

        mic.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          openMenu();
        });

        document.addEventListener('mousedown', (e) => {
          if (isOpen() && !menu.contains(e.target)) closeMenu();
        });

        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && isOpen()) closeMenu();
        });

        // Show a short message in the pill, then return it to idle. Reverts
        // only if nothing else has changed the state in the meantime, so a
        // dictation started during the notice is never clobbered.
        let noticeTimer = null;
        const showNotice = (message) => {
          const el = document.getElementById('notice-text');
          if (!el) return;
          el.textContent = message;
          mic.dataset.state = 'notice';
          if (noticeTimer) clearTimeout(noticeTimer);
          noticeTimer = setTimeout(() => {
            if (mic.dataset.state === 'notice') mic.dataset.state = 'idle';
          }, 2400);
        };

        menu.querySelectorAll('.menu-item').forEach((btn) => {
          btn.addEventListener('click', () => {
            const cmd = btn.dataset.action;
            const tauri = window.__TAURI__;
            if (tauri && tauri.core && typeof tauri.core.invoke === 'function') {
              // A swallowed rejection made a typo'd data-action, an
              // unregistered command and a real error ("No transcript yet")
              // all look identical: the menu item simply did nothing. Report
              // the reason instead.
              tauri.core.invoke(cmd).catch((err) => {
                console.error('[Demod] menu action failed:', cmd, err);
                showNotice(typeof err === 'string' ? err : 'That action could not run');
              });
            } else {
              showNotice('Menu unavailable outside the app');
            }
            closeMenu();
          });
        });
      })();

      // Idle hover hotkey tooltip. Mirrors the settings window's formatting
      // (src/main.ts formatHotkey: CmdOrCtrl/Cmd -> Ctrl, Super -> Win) so the
      // overlay and settings UI never disagree about what the hotkey reads
      // as. Resolved lazily on first hover rather than at load, so a hotkey
      // changed in Settings while the overlay is idle is picked up next
      // hover instead of going stale. On any invoke failure or a missing
      // `hotkey` field, the tooltip is left empty (`.has-hotkey` withheld) -
      // never falls back to a hardcoded/remembered string.
      (() => {
        const idleLayer = document.querySelector('.state-idle');
        const tooltip = document.getElementById('idle-hotkey');
        if (!idleLayer || !tooltip) return;

        const TOKEN_MAP = { CmdOrCtrl: 'Ctrl', Cmd: 'Ctrl', Super: 'Win' };
        const formatHotkey = (hotkey) =>
          String(hotkey)
            .split('+')
            .map((token) => TOKEN_MAP[token] ?? token)
            .join('+');

        let resolved = false; // avoid re-invoking on every hover once we know
        let lastGoodText = '';

        const clear = () => {
          tooltip.textContent = '';
          tooltip.classList.remove('has-hotkey');
        };

        const resolve = async () => {
          const tauri = window.__TAURI__;
          if (!tauri || !tauri.core || typeof tauri.core.invoke !== 'function') {
            clear();
            return;
          }
          try {
            const settings = await tauri.core.invoke('get_settings');
            const hotkey = settings && settings.hotkey;
            if (typeof hotkey !== 'string' || !hotkey) {
              clear();
              return;
            }
            lastGoodText = formatHotkey(hotkey);
            tooltip.textContent = lastGoodText;
            tooltip.classList.add('has-hotkey');
          } catch (err) {
            console.error('[Demod] get_settings failed:', err);
            clear();
          } finally {
            resolved = true;
          }
        };

        idleLayer.addEventListener('mouseenter', () => {
          if (!resolved) {
            resolve();
          } else if (lastGoodText) {
            tooltip.textContent = lastGoodText;
            tooltip.classList.add('has-hotkey');
          }
        });
      })();
    </script>
  </body>
</html>
