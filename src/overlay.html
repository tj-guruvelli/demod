<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* Fixed 440x160 transparent host window (Wispr "Status" window pattern).
         The OS window never resizes; the pill morphs entirely in here.
         All states are pre-mounted layers crossfaded with opacity + transform
         ONLY (GPU compositable - no width/height/layout animation). */
      * { margin: 0; padding: 0; }
      html, body {
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      /* Pill root: bottom-center of the host. The empty headroom above is
         animation/menu space and stays fully transparent.
         NOTE: the cursor hit rect in src-tauri/src/pill_hittest.rs (PILL_*
         consts) must track this geometry — the window is click-through
         except over that rect. */
      #mic {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 16px;
        height: 40px;
      }

      /* Every state is a pre-mounted layer, centered on the same point.
         Inactive: transparent, slightly sunk + shrunk, not hittable.
         Active: opaque, at rest. 150ms ease-out in / ease-in out. */
      .layer {
        position: absolute;
        left: 50%;
        top: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(20, 20, 20, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        opacity: 0;
        transform: translate(-50%, -50%) translateY(5px) scale(0.96);
        transition: opacity 150ms ease-in, transform 150ms ease-in;
        pointer-events: none;
        cursor: grab;
      }
      .layer:active { cursor: grabbing; }
      /* Children must not become the mousedown target, or the
         data-tauri-drag-region hit test on the layer fails. */
      .layer * { pointer-events: none; }

      #mic[data-state="idle"] .state-idle,
      #mic[data-state="listening"] .state-listening,
      #mic[data-state="processing"] .state-processing,
      #mic[data-state="done"] .state-done {
        opacity: 1;
        transform: translate(-50%, -50%);
        transition: opacity 150ms ease-out, transform 150ms ease-out;
        pointer-events: auto;
      }

      /* Idle: near-invisible dark lozenge. Brightens/expands slightly on
         hover so it reads as clickable (transform/opacity only). */
      .state-idle {
        width: 64px;
        height: 12px;
      }
      #mic[data-state="idle"] .state-idle:hover {
        transform: translate(-50%, -50%) scaleX(1.15) scaleY(1.2);
      }

      /* Listening: waveform pill. 14 pre-created bars driven by real mic RMS
         (the script below writes transform: scaleY each frame; no transition
         here or it would fight the rAF loop). Flat at rest. */
      .state-listening {
        width: 180px;
        height: 36px;
        gap: 3px;
      }
      .state-listening .bar {
        width: 3px;
        height: 22px;
        border-radius: 2px;
        background: #fff;
        transform: scaleY(0.08);
      }

      /* Processing: three dots pulsing with staggered opacity. */
      .state-processing {
        width: 120px;
        height: 36px;
        gap: 6px;
      }
      .state-processing .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #fff;
        opacity: 0.25;
      }
      #mic[data-state="processing"] .state-processing .dot {
        animation: dot-pulse 1s ease-in-out infinite;
      }
      #mic[data-state="processing"] .state-processing .dot:nth-child(2) {
        animation-delay: 0.15s;
      }
      #mic[data-state="processing"] .state-processing .dot:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes dot-pulse {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 1; }
      }

      /* Done: brief success tick. */
      .state-done {
        width: 64px;
        height: 36px;
      }
      .state-done svg {
        width: 18px;
        height: 18px;
        stroke: #6fe08c;
        stroke-width: 2.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>
  <body>
    <div id="mic" data-state="idle">
      <div class="layer state-idle" data-tauri-drag-region></div>
      <div class="layer state-listening" data-tauri-drag-region>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
      <div class="layer state-processing" data-tauri-drag-region>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div class="layer state-done" data-tauri-drag-region>
        <svg viewBox="0 0 24 24"><polyline points="5 12.5 10 17.5 19 7"/></svg>
      </div>
    </div>
    <script>
      // Waveform renderer: real mic RMS pushed from Rust (audio.rs emits
      // 'audio-level', a single float, at <=30Hz while recording). One rAF
      // loop runs ONLY while data-state=listening (started/stopped by a
      // MutationObserver on the attribute - event-driven, no polling); bars
      // animate via transform: scaleY exclusively, no layout reads.
      (() => {
        const FLOOR = 0.08;        // honest-flatline scaleY
        const SILENCE_RMS = 0.01;  // below this counts as silence
        const SILENCE_MS = 600;    // flatline after this much continuous silence
        const GAIN = 9;            // maps typical speech RMS (~0.02-0.3) to 0..1
        const EASE = 0.35;         // per-frame smoothing toward target

        const mic = document.getElementById('mic');
        const bars = Array.from(document.querySelectorAll('.state-listening .bar'));
        const center = (bars.length - 1) / 2;
        // Per-bar weighting: center-tall envelope plus a small random jitter,
        // fixed ONCE at load. Never re-randomized per frame: all motion must
        // come from the real level, not noise.
        const weights = bars.map((_, i) => {
          const envelope = 1 - 0.7 * (Math.abs(i - center) / center);
          return envelope * (0.85 + Math.random() * 0.3);
        });

        let level = 0;      // latest RMS from Rust
        let lastLoudAt = 0; // performance.now() of last above-threshold level
        const heights = bars.map(() => FLOOR);
        let rafId = 0;

        const frame = (now) => {
          const silent = now - lastLoudAt > SILENCE_MS;
          const norm = silent ? 0 : Math.min(1, Math.pow(level * GAIN, 0.7));
          for (let i = 0; i < bars.length; i++) {
            const target = Math.max(FLOOR, norm * weights[i]);
            heights[i] += (target - heights[i]) * EASE;
            bars[i].style.transform = 'scaleY(' + heights[i].toFixed(3) + ')';
          }
          rafId = requestAnimationFrame(frame);
        };

        const startLoop = () => {
          if (rafId) return;
          level = 0;
          lastLoudAt = performance.now();
          rafId = requestAnimationFrame(frame);
        };

        const stopLoop = () => {
          if (!rafId) return;
          cancelAnimationFrame(rafId);
          rafId = 0;
          for (let i = 0; i < bars.length; i++) {
            heights[i] = FLOOR;
            bars[i].style.transform = 'scaleY(' + FLOOR + ')';
          }
        };

        new MutationObserver(() => {
          if (mic.dataset.state === 'listening') startLoop();
          else stopLoop();
        }).observe(mic, { attributes: true, attributeFilter: ['data-state'] });

        // Rust emits with emit_to("overlay", ...): label-targeted events do
        // NOT reach target-Any listeners (plain event.listen), so listen on
        // this window's own target.
        const tauri = window.__TAURI__;
        if (tauri && tauri.webviewWindow) {
          tauri.webviewWindow.getCurrentWebviewWindow().listen('audio-level', (e) => {
            level = e.payload;
            if (level >= SILENCE_RMS) lastLoudAt = performance.now();
          });
        }
      })();
    </script>
  </body>
</html>
