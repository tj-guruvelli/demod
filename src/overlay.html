<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; }
      html, body {
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .mic {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 40px;
        min-width: 40px;
        padding: 0 12px;
        border-radius: 22px;
        background: rgba(30, 30, 30, 0.55);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        transition: all 0.25s ease;
        cursor: grab;
      }
      .mic:active { cursor: grabbing; }
      /* Children must not become the mousedown target, or the
         data-tauri-drag-region hit test on .mic fails. */
      .mic * { pointer-events: none; }
      .mic svg {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
        fill: #999;
        transition: fill 0.25s ease;
      }
      .label {
        display: none;
        font-size: 13px;
        font-weight: 500;
        color: #fff;
        white-space: nowrap;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      }
      .mic.recording {
        background: rgba(211, 47, 47, 0.92);
        border-color: rgba(255, 255, 255, 0.25);
        animation: pulse 1.2s ease-in-out infinite;
      }
      .mic.recording svg { fill: #fff; }
      .mic.recording .label-rec { display: inline; }
      .mic.transcribing {
        background: rgba(230, 145, 10, 0.92);
        border-color: rgba(255, 255, 255, 0.25);
        animation: pulse 1.5s ease-in-out infinite;
      }
      .mic.transcribing svg { fill: #fff; }
      .mic.transcribing .label-tx { display: inline; }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.03); opacity: 0.88; }
      }
    </style>
  </head>
  <body>
    <div class="mic" id="mic" data-tauri-drag-region>
      <svg viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
      <span class="label label-rec">Recording&hellip; Ctrl+Shift+Space to stop</span>
      <span class="label label-tx">Transcribing&hellip;</span>
    </div>
  </body>
</html>
